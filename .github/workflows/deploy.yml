name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every Friday at 11:05 UTC: 7:05 AM Eastern in summer, 6:05 AM in winter.
    # Publishes any journal post whose date has arrived. GitHub can start scheduled runs late; same day is normal.
    - cron: '5 11 * * 5'
  workflow_dispatch:

permissions:
  contents: write   # only used by the keep-alive step below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: TZ=America/New_York python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      # GitHub switches off scheduled workflows after 60 days with no commits. On scheduled runs,
      # if the last commit is more than 40 days old, push an empty commit so the Friday schedule keeps running.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -gt 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled publishing active [skip ci]"
            git push
          fi

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
